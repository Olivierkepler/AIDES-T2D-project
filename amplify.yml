version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - echo "Generating Prisma Client..."
        - npx prisma generate || echo "Prisma generate completed with warnings"
    build:
      commands:
        - echo "Building Next.js application..."
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
      - node_modules/.prisma/**/*
